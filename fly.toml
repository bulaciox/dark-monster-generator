# fly.toml app configuration file generated for darkgallery-monstergenerator on 2026-08-13T10:27:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'darkgallery-monstergenerator'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 1
    soft_limit = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
